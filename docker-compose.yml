services:
  db:
    image: postgres:15
    container_name: voting_app_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: demokratyczna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voting_app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d demokratyczna"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: voting_app_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - voting_app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: voting_app_backend
    ports:
      - "8000:8000"
    volumes:
      - ./project:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/demokratyczna
      # ZMIEŃ na losowy klucz przed deploymentem produkcyjnym!
      # Możesz wygenerować: python -c "import secrets; print(secrets.token_hex(32))"
      - SECRET_KEY=e04546c956d9096df05ed9626460d0f9e101a78f8c84818b2e8188afd951abb6
    command: uvicorn main:app --host 0.0.0.0 --reload
    networks:
      - voting_app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voting_app_frontend
    ports:
      - "4200:4200"
    networks:
      - voting_app_network

networks:
  voting_app_network:
    driver: bridge

volumes:
  postgres_data: