<div class="container">
  <nav class="navbar">
    <div class="navbar-brand">
      <h1>Voting App</h1>
    </div>
    <div class="navbar-menu">
      <div *ngIf="isLoggedIn" class="navbar-item">
        <span>Welcome, {{ currentUsername }}!</span>
        <button (click)="logout()" class="btn btn-logout">Logout</button>
      </div>
      <div *ngIf="!isLoggedIn" class="navbar-item">
        <a href="/login" class="btn btn-link">Login</a>
        <a href="/register" class="btn btn-link">Register</a>
      </div>
      <div *ngIf="isLoggedIn" class="navbar-item">
        <a href="/profile" class="btn btn-link">Profile</a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <section class="hero">
      <h2>Enter session code</h2>
      <div class="session-controls">
        <button class="btn btn-primary" (click)="createSession()" [disabled]="!isLoggedIn">Create Session</button>
        <div *ngIf="!isLoggedIn" class="session-note">
          Log in first to create a session.
        </div>
      </div>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      <form class="session-form" (ngSubmit)="enterSession()">
        <input type="text" name="joinCode" [(ngModel)]="joinCode" (ngModelChange)="updateJoinCode($event)" placeholder="_ _ _ - _ _ _" maxlength="6" pattern="[A-Za-z0-9]{6}" required />
        <button type="submit" class="btn btn-primary">Enter Session</button>
      </form>
    </section>
  </main>
</div>
