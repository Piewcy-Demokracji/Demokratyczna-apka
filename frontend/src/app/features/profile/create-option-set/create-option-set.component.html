<div class="create-option-set">
  <div class="header">
    <h2>{{ isEditing ? 'Edit Option Set' : 'Create New Option Set' }}</h2>
    <button class="btn btn-secondary" (click)="goBack()">Back to Profile</button>
  </div>

  <form (ngSubmit)="onSubmit()" #optionSetForm="ngForm">
    <div class="form-group">
      <label for="title">Option Set Name</label>
      <input
        type="text"
        id="title"
        name="title"
        [(ngModel)]="optionSet.title"
        required
        #title="ngModel"
        class="form-control"
        placeholder="e.g., Coffee Shops, Study Spots">
      <div *ngIf="title.invalid && title.touched" class="error-message">
        Title is required
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description (Optional)</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="optionSet.description"
        class="form-control"
        placeholder="Describe what this option set is for..."
        rows="3"></textarea>
    </div>

    <div class="form-group">
      <label>Options</label>
      <div class="options-list">
        <div *ngFor="let option of options; let i = index; trackBy: trackByIndex" class="option-item">
          <div class="option-row">
            <input
              type="text"
              [(ngModel)]="options[i].text"
              [name]="'option-' + i"
              class="form-control option-input"
              placeholder="Enter option text">
            <button
              type="button"
              class="btn btn-danger btn-sm remove-option"
              (click)="removeOption(i)"
              [disabled]="options.length <= 1">
              ×
            </button>
          </div>

          <div class="option-image-row">
            <label class="btn btn-secondary btn-sm">
              {{ options[i].uploading ? 'Uploading...' : (options[i].image_filename ? 'Change image' : 'Add image') }}
              <input
                type="file"
                accept="image/*"
                style="display:none"
                (change)="onFileSelected($event, i)"
                [disabled]="options[i].uploading">
            </label>
            <span *ngIf="options[i].uploadError" style="color:red; font-size:0.85em; margin-left:8px">
              {{ options[i].uploadError }}
            </span>
            <img
              *ngIf="options[i].image_filename"
              [src]="getImageUrl(options[i].image_filename)"
              alt="Option image"
              style="height:48px; width:48px; object-fit:cover; border-radius:6px; margin-left:8px;">
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" (click)="addOption()">
        + Add Option
      </button>
    </div>

    <div class="form-group">
      <label class="checkbox-label">
        <input
          type="checkbox"
          name="canBePublic"
          (ngModelChange)="onCanBePublicChange($event)"
          [(ngModel)]="optionSet.can_be_public">
        Allow admins to publish this set for other users
      </label>
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!optionSetForm.form.valid || options.length === 0 || isLoading">
        {{ isLoading ? 'Saving...' : (isEditing ? 'Update Option Set' : 'Create Option Set') }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="goBack()">Cancel</button>
    </div>
  </form>
</div>
