<div class="app-shell">
  <header class="app-nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <span>{{ appTitle }}</span>
      </div>
      <nav class="nav-links">
        <a routerLink="/">Home</a>
        <a *ngIf="isLoggedIn" routerLink="/profile">Profile</a>
        <a *ngIf="showAdminLink" routerLink="/admin/option-sets">Admin</a>
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login">Login</a>
          <a routerLink="/register">Register</a>
        </ng-container>
        <a *ngIf="isLoggedIn" (click)="logout()" style="cursor:pointer">Logout</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
